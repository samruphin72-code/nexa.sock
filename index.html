<div id="lg"><div class="cd"><h2>📦 Nexa Stock</h2><p class="hint">Connecte-toi à ton espace de gestion de stock.</p><label>E-mail</label><input id="le" type="email" autocomplete="username"><label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password"><div id="lm"></div><button class="btn" id="li">Se connecter</button><button class="btn g2" id="lf" type="button">Mot de passe oublié ?</button></div></div><div id="pr"></div><div id="toast"></div><input type="file" id="fi" accept=".xlsx,.xlsm,.xls" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,onSnapshot,collection,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={p:[],e:[],s:[]},U={mode:'e',tab:'e',view:'accueil'},CH={},K=['p','e','s'];let db=null;
const money=n=>'$'+(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}),num=n=>(+n||0).toLocaleString('fr-FR');
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16),nowISO=()=>iso(new Date()),fd=d=>new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const NAV=[['accueil','📊','Accueil'],['stock','📦','Stock'],['operation','➕','Opération'],['historique','🧾','Historique'],['produits','🗂️','Produits'],['plus','⚙️','Plus']];
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='on '+(t||'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)}
/* ---- Firebase : connexion + données du client ---- */
const app=initializeApp(firebaseConfig),auth=getAuth(app),DB=getFirestore(app);let UID=null,LOCK=false,LIC=null,unsub=[];
const lk=k=>'nx_'+UID+'_'+k;
function save(k){try{localStorage.setItem(lk(k),JSON.stringify(S[k]))}catch(e){}if(UID&&!LOCK)setDoc(doc(DB,'tenants',UID,'data',k),{rows:S[k]}).catch(()=>toast('Enregistrement refusé : abonnement expiré ou hors ligne','err'))}
const PAY={num:'0993302300',wa:'243993302300',px:35};
function payCard(){const m=encodeURIComponent(`Bonjour, j’ai payé mon abonnement Nexa Stock (${PAY.px} $) par Airtel Money. Mon e-mail de connexion : ${auth.currentUser?.email||''}.`);
 return`<div class="cd" style="margin-bottom:14px;border:2px solid var(--tl)"><h3>💳 Payer mon abonnement — ${PAY.px} $ / mois</h3><ol><li>Envoie <b>${PAY.px} $</b> par <b>Airtel Money</b> au <b style="font-size:17px">${PAY.num}</b>.</li><li>Indique ton e-mail de connexion en référence.</li><li>Envoie la capture de confirmation sur WhatsApp.</li><li>Ton abonnement est prolongé dès que le paiement est validé.</li></ol><a class="btn" style="text-decoration:none;display:inline-block;background:var(--gn)" target="_blank" rel="noopener" href="https://wa.me/${PAY.wa}?text=${m}">💬 J’ai payé — envoyer la preuve</a></div>`}
function lic(){const e=$('#lic');if(!LIC){e.textContent='Aucun abonnement trouvé : contacte ton fournisseur.';return}const t=LIC.fin.toDate(),d=t.toLocaleDateString('fr-FR'),dl=Math.max(0,Math.ceil((t-new Date())/864e5)),
 pay=' · <span data-a="go" data-v="plus" style="cursor:pointer;color:var(--tl);font-weight:700">💳 Payer</span>';
 e.innerHTML=LOCK?'<b style="color:#e03b2d">Abonnement '+(LIC.x?'suspendu':'expiré le '+d)+' — lecture seule</b>'+pay:(LIC.p=='Essai'?'🎁 Essai gratuit : <b>'+dl+' jour(s)</b> restant(s)'+pay:'Abonnement actif · jusqu’au '+d+(dl<=7?pay:''))}
function showLogin(){$('#lg').style.display='flex'}
async function boot(){nav();setInterval(()=>{const t=new Date().toLocaleString('fr-FR',{dateStyle:'full',timeStyle:'medium'});$('#clk').textContent=t;const c=$('#clk2');if(c)c.textContent=t},1000);
 onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];
  if(!u){UID=null;LIC=null;S.p=[];S.e=[];S.s=[];$('#lic').textContent='';render(1);showLogin();return}
  UID=u.uid;$('#lg').style.display='none';$('#lp').value='';
  try{K.forEach(k=>{const v=localStorage.getItem(lk(k));if(v)S[k]=JSON.parse(v)})}catch(e){}
  try{const c=await getDoc(doc(DB,'clients',UID));if(c.exists()){LIC=c.data();LOCK=!!LIC.x||LIC.fin.toDate()<new Date()}else{LIC=null;LOCK=true}}catch(e){LOCK=true}
  lic();render(1);
  K.forEach(k=>unsub.push(onSnapshot(doc(DB,'tenants',UID,'data',k),sn=>{if(sn.exists()){S[k]=sn.data().rows||[];refresh()}else if(S[k].length&&!LOCK)save(k)},()=>{})))})}
function inv(){const a={},b={};S.e.forEach(o=>a[o.c]=(a[o.c]||0)+o.q);S.s.forEach(o=>b[o.c]=(b[o.c]||0)+o.q);
 return S.p.map(p=>{const st=(p.ini||0)+(a[p.c]||0)-(b[p.c]||0);return{...p,st,val:st*p.pa,low:st<=p.min}})}
/* ---- navigation / rendu ---- */
function nav(){$('#nv').innerHTML='<b>📦 Nexa Stock<small>Gestion de stock</small></b>'+NAV.map(n=>`<button data-a="go" data-v="${n[0]}" class="${U.view==n[0]?'on':''}"><i>${n[1]}</i>${n[2]}</button>`).join('')}
function render(anim){const V={accueil:dash,stock:stk,operation:opv,historique:his,produits:prd,plus:plu},n=NAV.find(x=>x[0]==U.view);$('#ttl').textContent=n[1]+' '+n[2];
 const v=$('#v');v.className='';if(anim){void v.offsetWidth;v.className='in'}v.innerHTML=V[U.view]();nav();after()}
function refresh(){const a=document.activeElement;if(['operation','plus'].includes(U.view)||(a&&/INPUT|SELECT/.test(a.tagName)))return upd();render()}
function after(){document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,m=e.dataset.m,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800),x=to*(1-Math.pow(1-p,3));e.textContent=m?money(x):num(Math.round(x));if(p<1)requestAnimationFrame(f)})(t0)});
 if(U.view=='accueil')charts();if(U.view=='operation')upd()}
/* ---- accueil ---- */
function months(){const n=new Date(),r=[],base=S.p.reduce((a,p)=>a+(p.ini||0)*p.pa,0),pa=Object.fromEntries(S.p.map(p=>[p.c,p.pa]));
 for(let i=11;i>=0;i--){const a=new Date(n.getFullYear(),n.getMonth()-i,1),b=new Date(n.getFullYear(),n.getMonth()-i+1,1);let ve=0,vs=0,cum=base;
  S.e.forEach(o=>{const d=new Date(o.d);if(d<b)cum+=o.q*(pa[o.c]||0);if(d>=a&&d<b)ve+=o.q*o.pr});S.s.forEach(o=>{const d=new Date(o.d);if(d<b)cum-=o.q*(pa[o.c]||0);if(d>=a&&d<b)vs+=o.q*o.pr});
  r.push({l:a.toLocaleString('fr-FR',{month:'short'}),ve,vs,cum:Math.max(0,cum)})}return r}
function dash(){if(!S.p.length)return`<div class="cd em"><h2>👋 Bienvenue</h2><p class="hint">Importe ton fichier Excel pour retrouver tes données, ou essaie avec un exemple.</p><button class="btn" data-a="pick">📥 Importer mon Excel</button><button class="btn g2" data-a="demo">✨ Voir un exemple</button></div>`;
 const I=inv(),tot=I.reduce((a,x)=>a+x.st,0),val=I.reduce((a,x)=>a+x.val,0),low=I.filter(x=>x.low).length,m0=new Date(new Date().getFullYear(),new Date().getMonth(),1),
 ne=S.e.filter(o=>new Date(o.d)>=m0).length,ns=S.s.filter(o=>new Date(o.d)>=m0).length,crit=[...I].sort((a,b)=>a.st-a.min-(b.st-b.min)).slice(0,8),mx=Math.max(1,...I.map(x=>x.st));
 const mini=(t,v,c)=>`<div class="cd" style="border-left:5px solid ${c}"><small class="hint">${t}</small><h2 style="margin:4px 0 0;font-size:20px;color:${c}">${v}</h2></div>`;
 return`<div class="g k"><div class="cd kp k1"><small>📦 ARTICLES EN STOCK</small><h2 data-n="${tot}">0</h2><p>${I.length} références</p></div><div class="cd kp k2"><small>💰 VALEUR DU STOCK</small><h2 data-n="${val}" data-m="1">0</h2><p>Prix d’achat × stock</p></div><div class="cd kp k3"><small>🚨 ALERTES STOCK BAS</small><h2 data-n="${low}">0</h2><p>${low?'Attention !':'Tout est OK'}</p></div><div class="cd kp k4"><small>🔄 MOUVEMENTS DU MOIS</small><h2 data-n="${ne+ns}">0</h2><p>⬇ ${ne} entrées · ⬆ ${ns} sorties</p></div></div>
 <div class="g k" style="margin-top:14px">${mini('⬇️ Entrées (qté)',num(S.e.reduce((a,o)=>a+o.q,0)),'var(--gn)')}${mini('💵 Valeur entrées',money(S.e.reduce((a,o)=>a+o.q*o.pr,0)),'var(--gn)')}${mini('⬆️ Sorties (qté)',num(S.s.reduce((a,o)=>a+o.q,0)),'var(--or)')}${mini('💵 Valeur sorties',money(S.s.reduce((a,o)=>a+o.q*o.pr,0)),'var(--or)')}</div>
 <div class="g c2" style="margin-top:14px"><div class="cd"><h3>📈 Valeur du stock (12 mois)</h3><div class="cv"><canvas id="c1"></canvas></div></div><div class="cd"><h3>🍩 Stock par catégorie</h3><div class="cv"><canvas id="c2"></canvas></div></div></div>
 <div class="g c2" style="margin-top:14px"><div class="cd"><h3>📊 Entrées vs sorties ($)</h3><div class="cv"><canvas id="c3"></canvas></div></div><div class="cd"><h3>🏆 Articles les plus critiques</h3><div class="tw"><table><tr><th>ARTICLE</th><th>STOCK</th><th>ÉTAT</th></tr>${crit.map(x=>`<tr><td>${esc(x.n)}</td><td><div class="bar"><i style="width:${Math.max(3,x.st/mx*100)}%"></i></div>${num(x.st)}</td><td><span class="p ${x.low?'lo':'ok'}">${x.low?'⚠️ BAS':'✅ OK'}</span></td></tr>`).join('')}</table></div></div></div>`}
function mk(id,cfg){const c=document.getElementById(id);if(!c||!window.Chart)return;CH[id]&&CH[id].destroy();Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue('--mu').trim()||'#6b7280';cfg.options={...cfg.options,responsive:true,maintainAspectRatio:false};CH[id]=new Chart(c,cfg)}
function charts(){if(!S.p.length)return;const M=months(),I=inv(),cat={};I.forEach(x=>{if(x.st>0)cat[x.k||'Autre']=(cat[x.k||'Autre']||0)+x.st});
 mk('c1',{type:'line',data:{labels:M.map(m=>m.l),datasets:[{data:M.map(m=>m.cum),fill:true,tension:.4,borderColor:'#5b8def',borderWidth:3,pointRadius:0,backgroundColor:c=>{const g=c.chart.ctx.createLinearGradient(0,0,0,250);g.addColorStop(0,'rgba(91,141,239,.5)');g.addColorStop(1,'rgba(0,194,168,.04)');return g}}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'$'+num(v)}}}}});
 mk('c2',{type:'doughnut',data:{labels:Object.keys(cat),datasets:[{data:Object.values(cat),backgroundColor:['#00c2a8','#5b8def','#ff6b35','#f5b83d','#8e6cef','#9aa0ae','#e03b2d','#2ead4b'],borderWidth:2,borderColor:'transparent'}]},options:{cutout:'62%',plugins:{legend:{position:'bottom'}}}});
 mk('c3',{type:'bar',data:{labels:M.map(m=>m.l),datasets:[{label:'Entrées',data:M.map(m=>m.ve),backgroundColor:'#00c2a8',borderRadius:6},{label:'Sorties',data:M.map(m=>m.vs),backgroundColor:'#ff6b35',borderRadius:6}]},options:{plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>'$'+num(v)}}}}})}
/* ---- stock ---- */
function stk(){const q=(U.q||'').toLowerCase(),I=inv().filter(x=>(x.c+x.n+x.k).toLowerCase().includes(q)),mx=Math.max(1,...I.map(x=>x.st));
 return`<div class="cd"><input id="sq" placeholder="🔍 Rechercher un produit, un code, une catégorie…" value="${esc(U.q||'')}"><div class="tw" style="margin-top:10px"><table><tr><th>CODE</th><th>PRODUIT</th><th>CATÉGORIE</th><th>STOCK</th><th>MIN</th><th>PRIX ACHAT</th><th>VALEUR</th><th>ÉTAT</th></tr>${I.map(x=>`<tr><td><b>${esc(x.c)}</b></td><td>${esc(x.n)}</td><td>${esc(x.k)}</td><td><div class="bar"><i style="width:${Math.max(3,x.st/mx*100)}%"></i></div><b>${num(x.st)}</b></td><td>${num(x.min)}</td><td>${money(x.pa)}</td><td>${money(x.val)}</td><td><span class="p ${x.low?'lo':'ok'}">${x.low?'⚠️ STOCK BAS':'✅ OK'}</span></td></tr>`).join('')||'<tr><td colspan="8" class="hint">Aucun produit.</td></tr>'}</table></div></div>`}
/* ---- opération ---- */
function opv(){const I=inv(),e=U.mode=='e';return`<div class="cd ${e?'':'s'}" style="max-width:560px;margin:auto"><div class="seg"><button data-a="mode" data-v="e" class="${e?'on':''}">⬇️ Entrée</button><button data-a="mode" data-v="s" class="${e?'':'on'}">⬆️ Sortie</button></div>
 <label>Produit</label><select id="oc">${I.map(x=>`<option value="${esc(x.c)}">${esc(x.c)} · ${esc(x.n)}</option>`).join('')}</select><div class="hint" id="oi"></div>
 <div class="r2"><div><label>Quantité</label><div class="stp"><button data-a="st" data-v="-1">−</button><input id="oq" type="number" min="1" value="1" inputmode="numeric"><button data-a="st" data-v="1">+</button></div></div><div><label>Prix unitaire ($)</label><input id="op" type="number" step="0.01" min="0" inputmode="decimal" placeholder="prix catalogue"></div></div>
 <label>${e?'Fournisseur':'Client'} (optionnel)</label><input id="ot"><div class="tot"><span>Total</span><b id="otl">$0,00</b></div><div class="hint">🕒 <span id="clk2"></span><br>Date et heure automatiques (horloge de l’appareil).</div>
 <button class="big" data-a="go2">${e?'Enregistrer l’entrée':'Enregistrer la sortie'}</button></div>`}
function upd(){const c=$('#oc');if(!c||U.view!='operation')return;const p=inv().find(x=>x.c==c.value);if(!p)return;const pr=+$('#op').value||(U.mode=='e'?p.pa:p.pv);$('#op').placeholder=money(U.mode=='e'?p.pa:p.pv);$('#oi').innerHTML=`Stock actuel : <b>${num(p.st)}</b> ${esc(p.u||'')} · alerte à ${num(p.min)}`;$('#otl').textContent=money((+$('#oq').value||0)*pr)}
function op(){if(LOCK)return toast('Abonnement expiré : lecture seule','err');if(!S.p.length)return toast('Ajoute d’abord une marchandise','err');const c=$('#oc').value,q=Math.floor(+$('#oq').value),p=inv().find(x=>x.c==c);if(!(q>0))return toast('Quantité invalide','err');
 if(U.mode=='s'&&q>p.st)return toast(`Stock insuffisant : ${p.st} disponible`,'err');const pr=+$('#op').value||(U.mode=='e'?p.pa:p.pv),k=U.mode;S[k].push({d:nowISO(),c,q,pr,t:$('#ot').value.trim()});save(k);
 const ns=p.st+(k=='e'?q:-q);navigator.vibrate&&navigator.vibrate(30);toast(`${k=='e'?'Entrée':'Sortie'} enregistrée · ${p.n} · stock ${ns}`+(k=='s'&&ns<=p.min?' ⚠️ niveau d’alerte':''));$('#oq').value=1;$('#op').value='';$('#ot').value='';upd()}
/* ---- historique ---- */
function his(){const k=U.tab,rows=S[k].map((o,i)=>({...o,i})).sort((a,b)=>b.d.localeCompare(a.d)),pm=Object.fromEntries(S.p.map(p=>[p.c,p]));
 return`<div class="tabs"><button class="btn ${k=='e'?'on':''}" data-a="tab" data-v="e">⬇️ Entrées (${S.e.length})</button><button class="btn ${k=='s'?'on':''}" data-a="tab" data-v="s">⬆️ Sorties (${S.s.length})</button></div><div class="cd"><div class="tw"><table><tr><th>DATE</th><th>PRODUIT</th><th>QTÉ</th><th>PRIX</th><th>TOTAL</th><th>${k=='e'?'FOURNISSEUR':'CLIENT'}</th><th></th></tr>${rows.slice(0,200).map(o=>`<tr><td>${fd(o.d)}</td><td><b>${esc(o.c)}</b> ${esc(pm[o.c]?.n||'')}</td><td>${num(o.q)}</td><td>${money(o.pr)}</td><td>${money(o.q*o.pr)}</td><td>${esc(o.t)}</td><td><button class="btn g2" data-a="del" data-v="${k}:${o.i}">✕</button></td></tr>`).join('')||'<tr><td colspan="7" class="hint">Aucune opération.</td></tr>'}</table></div>${rows.length>200?'<p class="hint">200 plus récentes affichées — exporte en Excel pour tout voir.</p>':''}</div>`}
/* ---- produits ---- */
function prd(){const I=inv(),cats=[...new Set(S.p.map(p=>p.k).filter(Boolean))];return`<div class="cd"><h3>➕ Nouvelle marchandise</h3><div class="r2"><div><label>Désignation</label><input id="pn"></div><div><label>Catégorie</label><input id="pk" list="cl"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div><label>Unité</label><input id="pu" value="Unité"></div><div><label>Seuil d’alerte</label><input id="pm" type="number" min="0" value="5"></div><div><label>Prix achat ($)</label><input id="pa" type="number" step="0.01" min="0" value="0"></div><div><label>Prix vente ($)</label><input id="pv" type="number" step="0.01" min="0" value="0"></div><div><label>Stock initial</label><input id="pi" type="number" min="0" value="0"></div></div><button class="big" data-a="addp">Ajouter la marchandise</button></div>
 <div class="cd" style="margin-top:14px"><h3>📋 Liste (${I.length})</h3><div class="tw"><table><tr><th>CODE</th><th>PRODUIT</th><th>CATÉGORIE</th><th>ACHAT</th><th>VENTE</th><th>STOCK</th><th>ÉTAT</th><th></th></tr>${I.map((x,i)=>`<tr><td><b>${esc(x.c)}</b></td><td>${esc(x.n)}</td><td>${esc(x.k)}</td><td>${money(x.pa)}</td><td>${money(x.pv)}</td><td>${num(x.st)}</td><td><span class="p ${x.low?'lo':'ok'}">${x.low?'⚠️ BAS':'✅ OK'}</span></td><td><button class="btn g2" data-a="del" data-v="p:${i}">✕</button></td></tr>`).join('')}</table></div></div>`}
function addp(){if(LOCK)return toast('Abonnement expiré : lecture seule','err');const n=$('#pn').value.trim();if(!n)return toast('Entre la désignation','err');let i=S.p.length+1,c;do c='P-'+String(i++).padStart(3,'0');while(S.p.some(p=>p.c==c));
 S.p.push({c,n,k:$('#pk').value.trim()||'Autre',u:$('#pu').value||'Unité',pa:+$('#pa').value||0,pv:+$('#pv').value||0,min:+$('#pm').value||0,ini:+$('#pi').value||0});save('p');toast('Marchandise ajoutée · '+c);render()}
/* ---- plus : import / export / impression / guide ---- */
function plu(){return`${payCard()}<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="cd"><h3>📥 Importer depuis Excel</h3><p class="hint">Choisis ton fichier .xlsx ou .xlsm (feuilles Produits, Entrées, Sorties). Il remplace les données de l’application.</p><button class="btn" data-a="pick">Choisir mon fichier Excel</button></div>
 <div class="cd"><h3>📤 Exporter vers Excel</h3><p class="hint">Génère un classeur avec Entrées, Sorties, Produits et Inventaire, que tu peux ré-importer ici.</p><button class="btn" data-a="exp">Télécharger l’Excel</button></div>
 <div class="cd"><h3>🖨️ Imprimer</h3><label>Document</label><select id="pw"><option value="i">Inventaire</option><option value="e">Entrées</option><option value="s">Sorties</option><option value="r">Rapport de synthèse</option></select><label>Format</label><select id="pf"><option value="a4p">A4 portrait</option><option value="a4l">A4 paysage</option><option value="a5p">A5 portrait</option><option value="tk">Ticket 80 mm</option></select><button class="btn" style="margin-top:12px" data-a="prt">Imprimer / PDF</button></div></div>
 <div class="cd" style="margin-top:14px"><h3>📖 Guide d’utilisation</h3><ol><li><b>Démarrer :</b> Plus → Importer mon Excel (ou ajoute tes produits dans Produits).</li><li><b>Entrée :</b> Opération → Entrée → produit, quantité, prix → Enregistrer.</li><li><b>Sortie :</b> Opération → Sortie. Refusée si le stock est insuffisant.</li><li><b>Résultat immédiat :</b> Stock et Accueil se mettent à jour tout seuls.</li><li><b>Corriger :</b> Historique → ✕ sur la ligne (les stocks se recalculent).</li><li><b>Imprimer :</b> Plus → choisis document et format (A4, A5, ticket) → Imprimer / PDF.</li><li><b>Sauvegarder :</b> Plus → Télécharger l’Excel, régulièrement.</li><li><b>Téléphone / PC :</b> ouvre le même lien, connecté au même compte : les données sont synchronisées.</li></ol></div>`}
function nrm(t){return String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function dt(v){if(v==null||v==='')return null;if(v instanceof Date)return iso(v);if(typeof v=='number'){const d=new Date(Math.round((v-25569)*864e5));return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes()))}
 const m=String(v).match(/(\d+)\/(\d+)\/(\d+)(?:\D+(\d+):(\d+))?/);if(m)return iso(new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)));const d=new Date(v);return isNaN(d)?null:iso(d)}
function tbl(ws,key){const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}),hi=a.findIndex(r=>r.some(c=>nrm(c)===key));if(hi<0)return[];const h=a[hi].map(nrm);return a.slice(hi+1).map(r=>{const o={};h.forEach((k,i)=>{if(k)o[k]=r[i]});return o})}
async function imp(f){if(LOCK)return toast('Abonnement expiré : lecture seule','err');try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),fs=n=>wb.Sheets[wb.SheetNames.find(s=>nrm(s)===n)],P=fs('produits')||fs('marchandises');if(!P)return toast('Feuille « Produits » introuvable','err');
 const code=r=>String(r['code produit']||'').trim().toUpperCase(),ops=(ws,pt)=>ws?tbl(ws,'code produit').filter(r=>code(r)&&+r.quantite>0).map(r=>({d:dt(r.date)||nowISO(),c:code(r),q:+r.quantite,pr:+r['prix unitaire ($)']||0,t:String(r[pt]||'')})):[];
 S.p=tbl(P,'code').filter(r=>r.code&&r.produit).map(r=>({c:String(r.code).trim().toUpperCase(),n:String(r.produit),k:String(r.categorie||''),u:String(r.unite||'Unité'),pa:+r['prix achat ($)']||0,pv:+r['prix vente ($)']||0,min:+r['stock min']||0,ini:+r['stock initial']||0}));
 S.e=ops(fs('entrees'),'fournisseur');S.s=ops(fs('sorties'),'client');K.forEach(save);toast(`Importé : ${S.p.length} produits, ${S.e.length} entrées, ${S.s.length} sorties`);U.view='accueil';render(1)}catch(e){toast('Import impossible : '+e.message,'err')}}
async function exp(){const I=inv(),pm=Object.fromEntries(S.p.map(p=>[p.c,p])),wb=XLSX.utils.book_new(),
 ws=(n,H,R,dc)=>{const w=XLSX.utils.aoa_to_sheet([H,...R],{cellDates:true});w['!cols']=H.map(()=>({wch:18}));if(dc!=null)for(let r=1;r<=R.length;r++){const c=w[XLSX.utils.encode_cell({r,c:0})];if(c)c.z='dd/mm/yyyy hh:mm'}XLSX.utils.book_append_sheet(wb,w,n)},
 o=(a,pt)=>[['Date','Code Produit','Produit','Catégorie','Quantité','Prix Unitaire ($)',pt,'Total ($)'],a.map(x=>[new Date(x.d),x.c,pm[x.c]?.n||'',pm[x.c]?.k||'',x.q,x.pr,x.t,x.q*x.pr])];
 ws('Entrées',...o(S.e,'Fournisseur'),0);ws('Sorties',...o(S.s,'Client'),0);
 ws('Produits',['Code','Produit','Catégorie','Unité','Prix Achat ($)','Prix Vente ($)','Stock Min','Stock Initial','Stock Actuel','Valeur Stock ($)','Statut'],I.map(x=>[x.c,x.n,x.k,x.u,x.pa,x.pv,x.min,x.ini,x.st,x.val,x.low?'STOCK BAS':'OK']));
 ws('Inventaire',['Code','Produit','Stock Actuel','Valeur ($)','Statut'],I.map(x=>[x.c,x.n,x.st,x.val,x.low?'STOCK BAS':'OK']));
 const buf=XLSX.write(wb,{type:'array',bookType:'xlsx',cellDates:true}),fn='NexaStock_'+nowISO().slice(0,10)+'.xlsx';let d=null;try{d=await claude.use('downloads')}catch(e){}
 try{if(d)await d.save({filename:fn,data:buf});else XLSX.writeFile(wb,fn);toast('Excel prêt')}catch(e){toast('Téléchargement annulé','err')}}
function prt(){const w=$('#pw').value,f=$('#pf').value,I=inv(),pm=Object.fromEntries(S.p.map(p=>[p.c,p])),
 T=(t,H,R)=>`<h2>Nexa Stock — ${t}</h2><p>${new Date().toLocaleString('fr-FR')}</p><table><tr>${H.map(x=>`<th>${x}</th>`).join('')}</tr>${R.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`,
 O=(a,t)=>T(t,['Date','Produit','Qté','Prix','Total'],a.map(o=>[fd(o.d),o.c+' '+(pm[o.c]?.n||''),o.q,money(o.pr),money(o.q*o.pr)]));let h;
 if(w=='i')h=T('Inventaire',['Code','Produit','Stock','Min','Valeur','État'],I.map(x=>[x.c,x.n,x.st,x.min,money(x.val),x.low?'BAS':'OK']));else if(w=='e')h=O(S.e,'Entrées');else if(w=='s')h=O(S.s,'Sorties');
 else h=T('Synthèse',['Indicateur','Valeur'],[['Références',I.length],['Articles en stock',I.reduce((a,x)=>a+x.st,0)],['Valeur du stock',money(I.reduce((a,x)=>a+x.val,0))],['Alertes stock bas',I.filter(x=>x.low).length],['Valeur des entrées',money(S.e.reduce((a,o)=>a+o.q*o.pr,0))],['Valeur des sorties',money(S.s.reduce((a,o)=>a+o.q*o.pr,0))]]);
 $('#pr').innerHTML=h;$('#pr').className=f;$('#pg').textContent='@page{size:'+{a4p:'A4 portrait',a4l:'A4 landscape',a5p:'A5 portrait',tk:'80mm 297mm'}[f]+';margin:'+(f=='tk'?'3mm':'12mm')+'}';
 try{print()}catch(e){toast('Impression bloquée ici : ouvre la page dans un nouvel onglet','err')}}
function demo(){S.p=[['PH-01','iPhone 15','Téléphones',734,880,10,5],['PH-02','Samsung Galaxy S24','Téléphones',361,441,8,12],['PC-01','HP Pavilion 15','Ordinateurs',1115,1339,3,4],['VT-01','T-shirt Homme','Vêtements',11,17,20,60],['EL-01','Fer à repasser','Électroménager',25,39,5,3]].map(a=>({c:a[0],n:a[1],k:a[2],u:'Unité',pa:a[3],pv:a[4],min:a[5],ini:a[6]}));
 S.e=[{d:nowISO(),c:'PH-01',q:10,pr:734,t:'Fournisseur démo'},{d:nowISO(),c:'VT-01',q:40,pr:11,t:''}];S.s=[{d:nowISO(),c:'PH-02',q:6,pr:441,t:'Client démo'},{d:nowISO(),c:'PC-01',q:2,pr:1339,t:''}];K.forEach(save);render(1)}
/* ---- événements ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='go'){U.view=v;try{location.hash=v}catch(x){}scrollTo(0,0);render(1)}else if(a=='mode'){U.mode=v;render()}else if(a=='tab'){U.tab=v;render()}
 else if(a=='st'){const q=$('#oq');q.value=Math.max(1,(+q.value||1)+ +v);upd()}else if(a=='go2')op();else if(a=='addp')addp();else if(a=='pick')$('#fi').click();else if(a=='demo')demo();else if(a=='exp')exp();else if(a=='prt')prt();
 else if(a=='del'){if(!b.dataset.s){b.dataset.s=1;b.textContent='Sûr ?';b.className='btn rd';setTimeout(()=>{b.dataset.s='';b.textContent='✕';b.className='btn g2'},2500);return}const[k,i]=v.split(':');S[k].splice(+i,1);save(k);toast('Supprimé');render()}});
document.addEventListener('input',e=>{if(e.target.id=='sq'){U.q=e.target.value;const p=e.target.selectionStart;render();const s=$('#sq');s.focus();s.setSelectionRange(p,p)}else if(['oc','oq','op'].includes(e.target.id))upd()});
$('#fi').addEventListener('change',e=>{if(e.target.files[0])imp(e.target.files[0]);e.target.value=''});
$('#th').addEventListener('click',()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';if(U.view=='accueil')render()});
$('#li').onclick=async()=>{$('#lm').textContent='';try{await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}catch(e){$('#lm').textContent='E-mail ou mot de passe incorrect.'}};
$('#lp').addEventListener('keydown',e=>{if(e.key=='Enter')$('#li').click()});
$('#lf').onclick=async()=>{const m=$('#le').value.trim();if(!m){$('#lm').textContent='Entre ton e-mail puis reclique.';return}try{await sendPasswordResetEmail(auth,m);$('#lm').style.color='#2ead4b';$('#lm').textContent='E-mail de réinitialisation envoyé.'}catch(e){$('#lm').textContent='Envoi impossible.'}};
$('#lo').onclick=()=>signOut(auth);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const h0=(location.hash||'').slice(1);if(NAV.some(n=>n[0]==h0))U.view=h0;boot();
</script></body></html>
