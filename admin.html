<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexa Stock — Espace administrateur</title>
<meta name="robots" content="noindex"><style>
:root{--bg:#f3f4fb;--cd:#fff;--tx:#1b1f3b;--mu:#6b7280;--bd:#e6e9f2;--nv:#15183a;--vi:#6c5ce7;--tl:#00c2a8;--or:#ff6b35;--rd:#e03b2d;--gn:#2ead4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--bg:#0e1124;--cd:#181c38;--tx:#e8ebf7;--mu:#9aa3c0;--bd:#262b52}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}

nav b{color:#fff;font-size:19px;padding:4px 10px 16px}nav b small{display:block;color:#a79bff;font-weight:600;font-size:11px;letter-spacing:.08em}
nav button{display:flex;gap:10px;align-items:center;border:0;background:none;color:#c4c0ee;padding:11px 12px;border-radius:12px;font:inherit;cursor:pointer;transition:.2s}

main{margin-left:216px;padding:18px 22px 40px;max-width:1180px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:22px}
.top button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:6px 10px;cursor:pointer}
#v.in{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.c2{grid-template-columns:1fr 1fr}

.kp{color:#fff;border:0;position:relative;overflow:hidden}.kp:after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:#ffffff22}
.kp small{font-weight:700;font-size:11px;letter-spacing:.04em;opacity:.92}.kp h2{margin:6px 0 2px;font-size:28px}.kp p{margin:0;font-size:12px;opacity:.88}
.a1{background:linear-gradient(135deg,#8e7bff,#5a48d8)}.a2{background:linear-gradient(135deg,#2ed3b7,#0a9c88)}.a3{background:linear-gradient(135deg,#ffb347,#f07c10)}.a4{background:linear-gradient(135deg,#ff6a57,#c62f22)}
h3{margin:0 0 10px;font-size:14px}.cv{position:relative;height:240px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.05em;padding:8px;border-bottom:2px solid var(--bd);white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.p{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:#e3f8ea;color:#1e7a3a}.lo{background:#fde2e2;color:#c62f22}.wa{background:#fff1d6;color:#a35d00}.tr{background:#e6ecff;color:#2f4ec4}.sp{background:#eceef3;color:#555}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px}input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--vi);box-shadow:0 0 0 4px #6c5ce722}.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:12px;padding:9px 14px;background:var(--vi);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}.btn:active{transform:scale(.96)}
.btn.g2{background:var(--bd);color:var(--tx)}.btn.rd{background:var(--rd)}.btn.gn{background:var(--gn)}.btn.sm{padding:6px 10px;font-size:13px}
.cl{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}.cl .ac{display:flex;gap:6px;flex-wrap:wrap}.hint{color:var(--mu);font-size:12.5px}
ol,ul{padding-left:20px;line-height:1.7}#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:var(--nv);color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none;text-align:center;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--rd)}#pr{display:none}
@media(max-width:800px){nav{top:auto;width:auto;right:0;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:0}nav b{display:none}
nav button{flex-direction:column;gap:1px;font-size:10px;padding:6px 4px;flex:1}nav button:hover{transform:none}nav i{font-size:20px}main{margin-left:0;padding:12px 12px 100px}.c2,.r2{grid-template-columns:1fr}.k{grid-template-columns:1fr 1fr}.kp h2{font-size:22px}.top h1{font-size:18px}}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;color:#000;background:#fff;font-family:Arial,sans-serif}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#lg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#15183a,#241c5c);z-index:20;padding:20px}#lg .cd{width:100%;max-width:380px}#lg h2{margin:0 0 4px}#lm{color:#e03b2d;font-size:13px;min-height:18px;margin-top:8px}#lg .btn{width:100%;margin-top:12px}</style><style id="pg">@page{size:A5 portrait;margin:12mm}</style></head><body>
<nav id="nv"></nav><main><div class="top"><h1 id="ttl"></h1><span><button id="th">🌓</button> <button id="lo" title="Déconnexion">⎋</button></span></div><div id="v"></div></main><div id="lg"><div class="cd"><h2>📦 Nexa Stock</h2><p class="hint">Espace administrateur — accès réservé.</p><label>E-mail</label><input id="le" type="email" autocomplete="username"><label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password"><div id="lm"></div><button class="btn" id="li">Se connecter</button><button class="btn g2" id="lf" type="button">Mot de passe oublié ?</button></div></div><div id="pr"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,onSnapshot,collection,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP=location.origin+location.pathname.replace(/[^/]*$/,''),K=['c','y','o'],CH={};
const S={c:[],y:[],o:[{n:'Essai',px:0,j:14,d:'14 jours gratuits pour tester'},{n:'Abonnement',px:35,j:30,d:'Accès complet · 35 $ par mois · paiement Airtel Money'}]};
const U={view:'tableau',ed:null,rn:null,q:''};let db=null,denied=false;
const NAV=[['tableau','📊','Tableau'],['clients','👥','Clients'],['paiements','💳','Paiements'],['offres','🏷️','Offres'],['vendre','🚀','Vendre']];
const money=n=>'$'+(+n||0).toLocaleString('fr-FR',{maximumFractionDigits:2}),num=n=>(+n||0).toLocaleString('fr-FR');
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
const add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)},fd=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR');
const left=c=>Math.round((new Date(c.f+'T12:00')-new Date(today()+'T12:00'))/864e5);
const st=c=>{if(c.x)return['Suspendu','sp'];const l=left(c);if(l<0)return['Expiré','lo'];if(c.p=='Essai')return['Essai','tr'];if(l<=7)return['À renouveler','wa'];return['Actif','ok']};
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='on '+(t||'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2600)}
const app=initializeApp(firebaseConfig),auth=getAuth(app),DB=getFirestore(app),known={c:new Set(),y:new Set()};let unsub=[];
const clean=o=>JSON.parse(JSON.stringify(o));
async function save(k){try{if(k=='o'){await setDoc(doc(DB,'config','plans'),{rows:clean(S.o)});return}
 const col=k=='c'?'clients':'payments',ids=new Set(S[k].map(x=>x.id));
 for(const x of S[k])await setDoc(doc(DB,col,x.id),k=='c'?{...clean(x),fin:Timestamp.fromDate(new Date(x.f+'T23:59:59'))}:clean(x));
 for(const id of known[k])if(!ids.has(id))await deleteDoc(doc(DB,col,id))}catch(e){toast('Écriture refusée : '+(e.code||e.message),'err')}}
async function mkClient(o,pw){if(!o.m)return toast('E-mail de connexion obligatoire','err');if((pw||'').length<6)return toast('Mot de passe : 6 caractères minimum','err');
 try{const sec=getAuth(initializeApp(firebaseConfig,'sec'+Date.now())),cr=await createUserWithEmailAndPassword(sec,o.m,pw);await signOut(sec);
  S.c.push({id:cr.user.uid,...o});await save('c');U.ed=null;render();toast('Compte créé. Donne-lui : '+o.m+' + son mot de passe')}catch(e){toast('Création impossible : '+(e.code||e.message),'err')}}
function showLogin(){$('#lg').style.display='flex'}
async function boot(){nav();render(1);
 onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];if(!u){denied=false;S.c=[];S.y=[];render(1);showLogin();return}
  let ad=false;try{ad=(await getDoc(doc(DB,'admins',u.uid))).exists()}catch(e){}
  if(!ad){denied=true;$('#lg').style.display='none';render();return}
  denied=false;$('#lg').style.display='none';$('#lp').value='';render(1);
  unsub.push(onSnapshot(collection(DB,'clients'),sn=>{S.c=sn.docs.map(d=>{const {fin,...r}=d.data();return{...r,id:d.id}});known.c=new Set(S.c.map(x=>x.id));refresh()},()=>{}));
  unsub.push(onSnapshot(collection(DB,'payments'),sn=>{S.y=sn.docs.map(d=>({...d.data(),id:d.id}));known.y=new Set(S.y.map(x=>x.id));refresh()},()=>{}));
  unsub.push(onSnapshot(doc(DB,'config','plans'),sn=>{if(sn.exists()){S.o=sn.data().rows;refresh()}else save('o')},()=>{}))})}
function nav(){$('#nv').innerHTML='<b>📦 Nexa Stock<small>ADMINISTRATEUR</small></b>'+NAV.map(n=>`<button data-a="go" data-v="${n[0]}" class="${U.view==n[0]?'on':''}"><i>${n[1]}</i>${n[2]}</button>`).join('')}
function render(an){const n=NAV.find(x=>x[0]==U.view);$('#ttl').textContent=n[1]+' '+n[2];const v=$('#v');v.className='';if(an){void v.offsetWidth;v.className='in'}
 v.innerHTML=denied?'<div class="cd"><h3>🔒 Accès réservé</h3><p>Cet espace est réservé à l’administrateur de Nexa Stock.</p></div>':({tableau:dash,clients:cli,paiements:pay,offres:off,vendre:vente}[U.view])();nav();after()}
function refresh(){const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;render()}
function after(){document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,m=e.dataset.m,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800),x=to*(1-Math.pow(1-p,3));e.textContent=m?money(x):num(Math.round(x));if(p<1)requestAnimationFrame(f)})(t0)});if(U.view=='tableau'&&!denied)charts()}
const A=()=>S.c.map(c=>({...c,s:st(c)}));
function dash(){const a=A(),act=a.filter(c=>['Actif','À renouveler','Essai'].includes(c.s[0])),mrr=a.filter(c=>['Actif','À renouveler'].includes(c.s[0])).reduce((x,c)=>x+(+c.px||0),0),m=today().slice(0,7),mo=S.y.filter(p=>p.d.startsWith(m)).reduce((x,p)=>x+p.a,0),ren=a.filter(c=>['À renouveler','Expiré'].includes(c.s[0])),tot=S.y.reduce((x,p)=>x+p.a,0);
 if(!S.c.length)return`<div class="cd" style="text-align:center;padding:34px"><h2>👋 Bienvenue, administrateur</h2><p class="hint">Aucun client pour l’instant. Ajoute ton premier client pour suivre abonnements et paiements.</p><button class="btn" data-a="new">➕ Ajouter un client</button> <button class="btn g2" data-a="go" data-v="vendre">🚀 Comment vendre ?</button></div>`;
 return`<div class="g k"><div class="cd kp a1"><small>👥 CLIENTS ACTIFS</small><h2 data-n="${act.length}">0</h2><p>${S.c.length} au total</p></div><div class="cd kp a2"><small>🔁 REVENU MENSUEL (MRR)</small><h2 data-n="${mrr}" data-m="1">0</h2><p>Abonnements payants</p></div><div class="cd kp a3"><small>💵 ENCAISSÉ CE MOIS</small><h2 data-n="${mo}" data-m="1">0</h2><p>Total : ${money(tot)}</p></div><div class="cd kp a4"><small>⏰ À RENOUVELER</small><h2 data-n="${ren.length}">0</h2><p>Expirés ou sous 7 jours</p></div></div>
 <div class="g c2" style="margin-top:14px"><div class="cd"><h3>📈 Encaissements (6 mois)</h3><div class="cv"><canvas id="c1"></canvas></div></div><div class="cd"><h3>🍩 Clients par offre</h3><div class="cv"><canvas id="c2"></canvas></div></div></div>
 <div class="cd" style="margin-top:14px"><h3>⏰ À relancer</h3>${ren.length?ren.map(c=>`<div class="cl" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span><b>${esc(c.n)}</b> · ${esc(c.p)} · <span class="p ${c.s[1]}">${c.s[0]}</span> <span class="hint">fin ${fd(c.f)}</span></span><a class="btn gn sm" target="_blank" rel="noopener" href="${wa(c)}">💬 Relancer</a></div>`).join(''):'<p class="hint">Personne à relancer 🎉</p>'}</div>`}
function mk(id,cfg){const c=document.getElementById(id);if(!c||!window.Chart)return;CH[id]&&CH[id].destroy();Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue('--mu').trim();cfg.options={...cfg.options,responsive:true,maintainAspectRatio:false};CH[id]=new Chart(c,cfg)}
function charts(){if(!S.c.length)return;const n=new Date(),M=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),k=iso(d).slice(0,7);M.push({l:d.toLocaleString('fr-FR',{month:'short'}),v:S.y.filter(p=>p.d.startsWith(k)).reduce((x,p)=>x+p.a,0)})}
 mk('c1',{type:'bar',data:{labels:M.map(m=>m.l),datasets:[{data:M.map(m=>m.v),backgroundColor:'#6c5ce7',borderRadius:8}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'$'+num(v)}}}}});
 mk('c2',{type:'doughnut',data:{labels:S.o.map(o=>o.n),datasets:[{data:S.o.map(o=>S.c.filter(c=>c.p==o.n).length),backgroundColor:['#9aa0ae','#00c2a8','#6c5ce7','#ff6b35'],borderWidth:2,borderColor:'transparent'}]},options:{cutout:'62%',plugins:{legend:{position:'bottom'}}}})}
const wa=c=>{const l=left(c),msg=`Bonjour ${c.n}, votre abonnement Nexa Stock (${c.p}) ${l<0?'a expiré le':'arrive à échéance le'} ${fd(c.f)}. Pour continuer (35 $/mois), envoyez le paiement par Airtel Money au 0993302300, puis la capture de confirmation ici. Merci de votre confiance !`;return'https://wa.me/'+String(c.t||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg)};
function form(){const c=U.ed=='new'?{p:'Essai',px:0,s:today(),f:add(today(),14),l:APP}:S.c.find(x=>x.id==U.ed);if(!c)return'';const f=(i,l,v,t)=>`<div><label>${l}</label><input id="${i}" type="${t||'text'}" value="${esc(v)}"></div>`;
 return`<div class="cd" style="margin-bottom:14px"><h3>${U.ed=='new'?'➕ Nouveau client':'✏️ Modifier le client'}</h3><div class="r2">${f('fn','Nom du client',c.n)}${f('fe','Entreprise / boutique',c.e)}${f('ft','WhatsApp (avec indicatif, ex. 243…)',c.t,'tel')}${f('fm','E-mail de connexion',c.m,'email')}${U.ed=='new'?f('fw','Mot de passe initial (6 caractères min.)','','text'):''}
 <div><label>Offre</label><select id="fp">${S.o.map(o=>`<option ${o.n==c.p?'selected':''}>${esc(o.n)}</option>`).join('')}</select></div>${f('fx','Prix par mois ($)',c.px,'number')}${f('fs','Début',c.s,'date')}${f('ff','Fin d’abonnement',c.f,'date')}</div>${f('fl','Lien de l’appli à lui envoyer',c.l)}<label>Notes</label><textarea id="fo" rows="2">${esc(c.o||'')}</textarea>
 <div style="margin-top:12px;display:flex;gap:8px"><button class="btn" data-a="sv">Enregistrer</button><button class="btn g2" data-a="cx">Annuler</button></div></div>`}
function cli(){const q=U.q.toLowerCase(),a=A().filter(c=>(c.n+c.e+c.t+c.p).toLowerCase().includes(q));
 const rn=U.rn&&S.c.find(c=>c.id==U.rn),rp=rn?`<div class="cd" style="margin-bottom:14px;border:2px solid var(--gn)"><h3>💳 Renouveler — ${esc(rn.n)}</h3><div class="r2"><div><label>Durée</label><select id="rm"><option value="1">1 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">12 mois</option></select></div><div><label>Mode de paiement</label><select id="rd"><option>Airtel Money</option><option>Autre Mobile Money</option><option>Espèces</option><option>Banque</option></select></div></div><label>Montant reçu ($)</label><input id="ra" type="number" value="${rn.px}"><div style="margin-top:12px;display:flex;gap:8px"><button class="btn gn" data-a="rok">Valider le paiement</button><button class="btn g2" data-a="cx">Annuler</button></div></div>`:'';
 return`<div class="cl" style="margin-bottom:12px"><input id="cq" placeholder="🔍 Rechercher un client…" value="${esc(U.q)}" style="flex:1;min-width:180px"><button class="btn" data-a="new">➕ Nouveau client</button></div>${U.ed?form():''}${rp}
 <div class="g">${a.map(c=>`<div class="cd"><div class="cl"><div><b style="font-size:16px">${esc(c.n)}</b> <span class="p ${c.s[1]}">${c.s[0]}</span><div class="hint">${esc(c.e)} · ${esc(c.t)}</div><div class="hint">Offre <b>${esc(c.p)}</b> · ${money(c.px)}/mois · fin ${fd(c.f)} (${left(c)>=0?left(c)+' j':'expiré'})</div></div>
 <div class="ac"><button class="btn gn sm" data-a="rn" data-v="${c.id}">💳 Renouveler</button><a class="btn sm" target="_blank" rel="noopener" href="${wa(c)}">💬 WhatsApp</a><button class="btn g2 sm" data-a="rs" data-v="${c.id}" title="Réinitialiser le mot de passe">🔑</button><button class="btn g2 sm" data-a="ed" data-v="${c.id}">✏️</button><button class="btn g2 sm" data-a="sp" data-v="${c.id}">${c.x?'▶️ Réactiver':'⏸ Suspendre'}</button><button class="btn g2 sm" data-a="del" data-v="c:${c.id}">✕</button></div></div>${c.o?`<div class="hint" style="margin-top:6px">📝 ${esc(c.o)}</div>`:''}</div>`).join('')||'<div class="cd hint">Aucun client.</div>'}</div>`}
function pay(){const pm=Object.fromEntries(S.c.map(c=>[c.id,c])),r=[...S.y].sort((a,b)=>b.d.localeCompare(a.d));return`<div class="cd"><h3>💳 Historique des paiements — total ${money(S.y.reduce((x,p)=>x+p.a,0))}</h3><div class="tw"><table><tr><th>DATE</th><th>CLIENT</th><th>MONTANT</th><th>MODE</th><th>PÉRIODE</th><th></th></tr>${r.map(p=>`<tr><td>${fd(p.d)}</td><td>${esc(pm[p.c]?.n||'(supprimé)')}</td><td><b>${money(p.a)}</b></td><td>${esc(p.mo)}</td><td>${esc(p.n)}</td><td><button class="btn g2 sm" data-a="rc" data-v="${p.id}">🖨️ Reçu</button> <button class="btn g2 sm" data-a="del" data-v="y:${p.id}">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="hint">Aucun paiement. Utilise « Renouveler » sur un client.</td></tr>'}</table></div></div>`}
function off(){return`<div class="g k">${S.o.map((o,i)=>`<div class="cd"><h3>🏷️ ${esc(o.n)}</h3><p class="hint">${esc(o.d)}</p><label>Prix par mois ($)</label><input type="number" min="0" value="${o.px}" data-c="${i}:px"><label>Durée par défaut (jours)</label><input type="number" min="1" value="${o.j}" data-c="${i}:j"><p class="hint" style="margin-top:10px">${S.c.filter(c=>c.p==o.n).length} client(s)</p></div>`).join('')}</div><p class="hint">Ces prix servent de valeurs par défaut quand tu crées un client ; tu peux toujours les ajuster client par client.</p>`}
function vente(){return`<div class="g c2"><div class="cd"><h3>🎯 1. Définis ton offre</h3><ul><li>Cible : boutiques, pharmacies, quincailleries, dépôts, petits grossistes.</li><li>Promesse : « Ton stock à jour en temps réel, sur téléphone et ordinateur. »</li><li>Offre : essai gratuit de 14 jours, puis abonnement à 35 $ par mois (onglet Offres).</li></ul></div>
 <div class="cd"><h3>📣 2. Trouve tes premiers clients</h3><ul><li>Démonstration en direct chez le commerçant, 10 minutes sur son téléphone.</li><li>WhatsApp / Facebook : courtes vidéos de l’appli en action, avant/après (cahier → Nexa Stock).</li><li>Bouche-à-oreille : 1 mois offert pour chaque client parrainé.</li></ul></div>
 <div class="cd"><h3>🛠️ 3. Installe et forme</h3><ul><li>Importe son stock (Excel ou saisie), forme-le 30 minutes.</li><li>Fais payer l’installation à part (service) : revenu immédiat.</li><li>Envoie-lui son lien depuis la fiche client.</li></ul></div>
 <div class="cd"><h3>💳 4. Encaisse et relance</h3><ul><li>Paiement : le client envoie 35 $ par Airtel Money au 0993302300 puis la capture sur WhatsApp ; tu valides avec « Renouveler » (reçu imprimable).</li><li>Onglet Tableau → « À relancer » : message WhatsApp prêt en un clic.</li><li>Renouvelle en un clic, suspends les impayés.</li></ul></div>
 <div class="cd"><h3>🔐 5. Sécurité</h3><ul><li>Chaque client a son compte (e-mail + mot de passe) et ses données séparées.</li><li>Un abonnement expiré ou suspendu passe automatiquement en lecture seule (règles Firestore).</li><li>Seuls les comptes listés dans la collection « admins » accèdent à cet espace.</li></ul></div><div class="cd"><h3>📈 6. Passer à l’échelle</h3><ul><li>Pilote avec 5 à 10 clients, ajuste prix et besoins.</li><li>Ajoute ton domaine, un contrat/CGV simples et une politique de confidentialité.</li><li>Au-delà de ~5 000 opérations par client, prévois un stockage ligne par ligne (je peux l’adapter).</li><li>Active les sauvegardes régulières (export Firestore) et demande un exemple de reçu à chaque paiement.</li></ul></div></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='go'){U.view=v;U.ed=U.rn=null;scrollTo(0,0);render(1)}else if(a=='new'){U.view='clients';U.ed='new';render(1)}else if(a=='cx'){U.ed=U.rn=null;render()}else if(a=='ed'){U.ed=v;U.rn=null;render();scrollTo(0,0)}else if(a=='rn'){U.rn=v;U.ed=null;render();scrollTo(0,0)}
 else if(a=='sv'){const g=i=>$('#'+i).value.trim(),n=g('fn');if(!n)return toast('Entre le nom du client','err');const o={n,e:g('fe'),t:g('ft'),m:g('fm'),p:$('#fp').value,px:+g('fx')||0,s:g('fs')||today(),f:g('ff')||add(today(),30),l:g('fl'),o:g('fo')};
  if(U.ed=='new'){mkClient(o,$('#fw').value);return}Object.assign(S.c.find(c=>c.id==U.ed),o);save('c');U.ed=null;toast('Client enregistré');render()}
 else if(a=='rs'){const c=S.c.find(x=>x.id==v);sendPasswordResetEmail(auth,c.m).then(()=>toast('E-mail de réinitialisation envoyé à '+c.m)).catch(e=>toast(e.code||e.message,'err'))}else if(a=='sp'){const c=S.c.find(x=>x.id==v);c.x=!c.x;save('c');toast(c.x?'Client suspendu':'Client réactivé');render()}
 else if(a=='rok'){const c=S.c.find(x=>x.id==U.rn),m=+$('#rm').value,am=+$('#ra').value||0,base=left(c)>0?c.f:today();c.f=add(base,30*m);c.x=false;if(c.p=='Essai'){c.p=S.o[1].n;c.px=S.o[1].px}save('c');
  S.y.push({id:Date.now().toString(36),d:today(),c:c.id,a:am,mo:$('#rd').value,n:m+' mois (jusqu’au '+fd(c.f)+')'});save('y');U.rn=null;toast('Paiement enregistré · abonnement prolongé');render()}
 else if(a=='rc'){const p=S.y.find(x=>x.id==v),c=S.c.find(x=>x.id==p.c)||{};$('#pr').innerHTML=`<div style="border:2px solid #000;padding:18px"><h2 style="margin:0">Nexa Stock</h2><p style="margin:2px 0 14px">REÇU DE PAIEMENT n° ${esc(p.id.toUpperCase())}</p><p>Date : <b>${fd(p.d)}</b></p><p>Reçu de : <b>${esc(c.n||'')}</b> ${esc(c.e||'')}</p><p>Montant : <b style="font-size:20px">${money(p.a)}</b></p><p>Mode : ${esc(p.mo)}</p><p>Objet : abonnement ${esc(c.p||'')} — ${esc(p.n)}</p><p style="margin-top:30px">Signature : ____________________</p></div>`;try{print()}catch(x){toast('Impression bloquée ici : ouvre la page dans un onglet','err')}}
 else if(a=='del'){if(!b.dataset.s){b.dataset.s=1;b.textContent='Sûr ?';b.classList.add('rd');setTimeout(()=>{b.dataset.s='';b.textContent='✕';b.classList.remove('rd')},2500);return}const[k,id]=v.split(':');S[k]=S[k].filter(x=>x.id!=id);save(k);toast('Supprimé');render()}});
document.addEventListener('input',e=>{if(e.target.id=='cq'){U.q=e.target.value;const p=e.target.selectionStart;render();const s=$('#cq');s.focus();s.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.c){const[i,f]=t.dataset.c.split(':');S.o[+i][f]=+t.value||0;save('o');toast('Offre mise à jour')}
 if(t.id=='fp'||t.id=='fs'){const o=S.o.find(x=>x.n==$('#fp').value);if(U.ed=='new'&&o){$('#fx').value=o.px;$('#ff').value=add($('#fs').value||today(),o.j)}}});
$('#th').addEventListener('click',()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';render()});
$('#li').onclick=async()=>{$('#lm').textContent='';try{await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}catch(e){$('#lm').textContent='E-mail ou mot de passe incorrect.'}};
$('#lp').addEventListener('keydown',e=>{if(e.key=='Enter')$('#li').click()});
$('#lf').onclick=async()=>{const m=$('#le').value.trim();if(!m){$('#lm').textContent='Entre ton e-mail puis reclique.';return}try{await sendPasswordResetEmail(auth,m);$('#lm').style.color='#2ead4b';$('#lm').textContent='E-mail de réinitialisation envoyé.'}catch(e){$('#lm').textContent='Envoi impossible.'}};
$('#lo').onclick=()=>signOut(auth);
boot();
